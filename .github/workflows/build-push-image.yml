# ============================================================
# AzurPilot 自动构建并推送镜像
#
# 触发条件：
#   - 上游发版打 v*.*.* tag 时（如果你手动在 fork 打 v 版 tag）
#   - sync-upstream.yml 同步上游后自动打的 sync-* tag
#   - 在 Actions 页面手动 Run workflow 随时重建
#
# 默认推送到 GitHub Packages (GHCR)：ghcr.io/<你的账号>/azurpilot
# 使用内置 GITHUB_TOKEN，无需任何额外 Secret，开箱即用。
#
# 想改用阿里云 ACR / 腾讯云 TCR / Docker Hub？
#   把下方 registry 与 login 段替换即可（见文件末尾注释）。
# ============================================================

name: Build and Push AzurPilot Image

on:
  push:
    tags:
      - "v*.*.*"      # 上游发版
      - "sync-*"      # 同步上游后触发
  workflow_dispatch:   # 手动触发
    inputs:
      extra_tag:
        description: "额外打的镜像 tag，例如 nightly"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: azurpilot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # 只读代码
      packages: write     # 推送 GHCR 必需
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # —— 登录镜像仓库（GHCR 用内置 Token，零配置）——
      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # —— 生成镜像 tag：v* 用语义化版本；sync-* 与手动都附 latest ——
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref,'refs/tags/v') || startsWith(github.ref,'refs/tags/sync-') }}
            type=raw,value=${{ github.event.inputs.extra_tag }},enable=${{ github.event.inputs.extra_tag != '' }}

      # —— 构建并推送（用修正版 Dockerfile，构建时自动 uv lock）——
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.azurpilot
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ============================================================
# 改用阿里云 ACR 示例（二选一替换上面 login + env）：
#
# env:
#   REGISTRY: registry.cn-hangzhou.aliyuncs.com
#   IMAGE_NAME: <你的ACR命名空间>/azurpilot
